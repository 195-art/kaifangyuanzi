<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>线上活动报名系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #333; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }

  /* 顶部 */
  .header { display: flex; justify-content: space-between; align-items: center; background: #fff;
            padding: 14px 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .header h1 { font-size: 20px; color: #4a69bd; }
  #userInfo { font-size: 14px; color: #666; }
  #userInfo button { margin-left: 10px; }

  /* 按钮和输入框通用 */
  button { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .btn-primary { background: #4a69bd; color: #fff; }
  .btn-primary:hover { background: #3b5998; }
  .btn-danger { background: #e74c3c; color: #fff; }
  .btn-green { background: #27ae60; color: #fff; }
  input, textarea { padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; width: 100%; }
  label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }

  /* 表单弹层 */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
             justify-content: center; align-items: center; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; width: 420px; max-width: 92vw; }
  .modal h2 { margin-bottom: 16px; font-size: 18px; }
  .form-row { margin-bottom: 12px; }

  /* 活动卡片 */
  .event-list { margin-top: 20px; display: grid; gap: 14px; }
  .event-card { background: #fff; border-radius: 10px; padding: 18px 20px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .event-card h3 { font-size: 17px; color: #2c3e50; margin-bottom: 8px; }
  .event-card .meta { font-size: 13px; color: #888; margin-bottom: 6px; line-height: 1.7; }
  .event-card .status-tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 10px; }
  .status-upcoming { background: #e8f6ff; color: #2980b9; }
  .status-ended { background: #f0f0f0; color: #999; }
  .event-card .actions { margin-top: 10px; }
  .event-card .actions button { margin-right: 8px; }

  .msg { margin-top: 14px; font-size: 13px; color: #e74c3c; min-height: 18px; }
  .empty { text-align: center; color: #aaa; padding: 40px 0; }
</style>
</head>
<body>
  <div class="container">


    <div class="header">
      <h1>线上活动报名系统</h1>
      <div id="userInfo">
        <span id="welcome"></span>
        <button class="btn-primary" id="btnLogin" onclick="showLogin()">登录 / 注册</button>
        <button class="btn-green" id="btnMine" onclick="loadMine()" style="display:none">我的报名</button>
        <button class="btn-danger" id="btnLogout" onclick="logout()" style="display:none">退出</button>
      </div>
    </div>


    <div style="margin-top:16px;display:flex;gap:10px;align-items:center;background:#fff;padding:12px;border-radius:10px;">
      <input id="kw" placeholder="搜索标题或描述" style="flex:1">
      <select id="st" style="padding:8px;border:1px solid #ddd;border-radius:6px;">
        <option value="">全部状态</option>
        <option value="即将开始">即将开始</option>
        <option value="已结束">已结束</option>
      </select>
      <button class="btn-primary" onclick="loadEvents()">搜索</button>
      <button class="btn-green" id="btnCreate" onclick="showCreate()" style="display:none">发起活动</button>
    </div>

    <div id="msg" class="msg"></div>


    <div class="event-list" id="eventList"></div><div id="pagination" style="display:flex;gap:12px;align-items:center;justify-content:center;margin-top:16px"><button id="prevPage" onclick="changePage(-1)">上一页</button><span id="pageInfo"></span><button id="nextPage" onclick="changePage(1)">下一页</button></div>


    <div class="overlay" id="loginOverlay" onclick="if(event.target===this)hide('loginOverlay')">
      <div class="modal">
        <h2 id="loginTitle">登录</h2>
        <div class="form-row"><label>用户名</label><input id="loginUser"></div>
        <div class="form-row"><label>密码</label><input id="loginPass" type="password"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;">
          <button class="btn-green" onclick="doLogin()">登录</button>
          <button class="btn-primary" onclick="doRegister()">注册并登录</button>
        </div>
      </div>
    </div>


    <div class="overlay" id="createOverlay" onclick="if(event.target===this)hide('createOverlay')">
      <div class="modal">
        <h2 id="eventFormTitle">发起新活动</h2><input id="cId" type="hidden">
        <div class="form-row"><label>标题</label><input id="cTitle"></div>
        <div class="form-row"><label>详细描述</label><textarea id="cDesc" rows="2"></textarea></div>
        <div class="form-row"><label>举办地点</label><input id="cLoc"></div>
        <div class="form-row"><label>活动时间</label><input id="cTime" type="datetime-local" step="1"></div>
        <div class="form-row"><label>名额上限</label><input id="cCap" type="number" value="50"></div>
        <div style="display:flex;justify-content:flex-end;">
          <button class="btn-primary" onclick="doCreate()">保存</button>
        </div>
      </div>
    </div>

  </div>

<script>
const TOKEN_KEY = 'token';
let currentUser = null;
let currentPage = 1;
let totalPages = 1;
let showingMine = false;

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(token) {
  if (token) localStorage.setItem(TOKEN_KEY, token);
  else localStorage.removeItem(TOKEN_KEY);
}
function msg(text) { document.getElementById('msg').textContent = text || ''; }
function show(id) { document.getElementById(id).classList.add('show'); }
function hide(id) { document.getElementById(id).classList.remove('show'); }
function val(id) { return document.getElementById(id).value.trim(); }
function esc(value) {
  return (value == null ? '' : String(value)).replace(/[&<>"']/g,
    c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}
function succeeded(result) { return result.status === 200 && result.data && result.data.code === 200; }

async function api(url, method = 'GET', body = null, useToken = true) {
  const headers = {};
  const token = useToken ? getToken() : null;
  if (token) headers.token = token;
  let payload;
  if (body instanceof URLSearchParams) {
    headers['Content-Type'] = 'application/x-www-form-urlencoded';
    payload = body.toString();
  } else if (body != null) {
    headers['Content-Type'] = 'application/json';
    payload = JSON.stringify(body);
  }
  try {
    const response = await fetch(url, {method, headers, body: payload});
    const data = await response.json();
    if (response.status === 200 && data.code === 200) {
      const newToken = response.headers.get('token');
      if (newToken) setToken(newToken);
    }
    if (response.status === 401 && token) {
      setToken(null);
      currentUser = null;
      refreshHeader();
    }
    return {status: response.status, data};
  } catch (e) {
    return {status: 0, data: {message: '请求失败，请检查网络和服务'}};
  }
}

function showLogin() { show('loginOverlay'); }

async function doLogin() {
  const username = val('loginUser');
  const password = document.getElementById('loginPass').value;
  if (!username || !password) { msg('请输入用户名和密码'); return; }
  const result = await api('/Q10/auth/login', 'POST', new URLSearchParams({username, password}), false);
  if (!succeeded(result)) { msg(result.data.message); return; }
  const user = await api('/Q10/auth/me');
  if (!succeeded(user)) { msg(user.data.message); return; }
  currentUser = user.data.data;
  document.getElementById('loginPass').value = '';
  hide('loginOverlay');
  refreshHeader();
  msg('登录成功');
  await loadEvents();
}

async function doRegister() {
  const username = val('loginUser');
  const password = document.getElementById('loginPass').value;
  if (!username || !password) { msg('请输入用户名和密码'); return; }
  const result = await api('/Q10/auth/register', 'POST', new URLSearchParams({username, password}), false);
  if (!succeeded(result)) { msg(result.data.message); return; }
  await doLogin();
}

function logout() {
  setToken(null);
  currentUser = null;
  refreshHeader();
  msg('已退出登录');
  loadEvents();
}

function refreshHeader() {
  const loggedIn = currentUser != null;
  document.getElementById('btnLogin').style.display = loggedIn ? 'none' : 'inline-block';
  for (const id of ['btnMine', 'btnLogout', 'btnCreate']) {
    document.getElementById(id).style.display = loggedIn ? 'inline-block' : 'none';
  }
  document.getElementById('welcome').textContent = loggedIn ? currentUser.username : '';
}

async function loadEvents(resetPage = true) {
  showingMine = false;
  if (resetPage) currentPage = 1;
  const params = new URLSearchParams({page: currentPage, size: 10});
  const keyword = val('kw');
  const status = document.getElementById('st').value;
  if (keyword) params.set('keyword', keyword);
  if (status) params.set('status', status);
  const result = await api('/Q11/event/list?' + params);
  if (!succeeded(result)) { msg(result.data.message); return; }
  const page = result.data.data;
  totalPages = Math.max(1, Math.ceil(page.total / page.size));
  if (currentPage > totalPages) { currentPage = totalPages; return loadEvents(false); }
  renderList(page.records);
  document.getElementById('pagination').style.display = 'flex';
  document.getElementById('pageInfo').textContent = currentPage + ' / ' + totalPages + ' 页，共 ' + page.total + ' 场活动';
  document.getElementById('prevPage').disabled = currentPage <= 1;
  document.getElementById('nextPage').disabled = currentPage >= totalPages;
}

function changePage(step) {
  const next = currentPage + step;
  if (next < 1 || next > totalPages) return;
  currentPage = next;
  loadEvents(false);
}

function renderList(records) {
  const box = document.getElementById('eventList');
  const list = (records || []).filter(Boolean);
  if (!list.length) { box.innerHTML = '<div class="empty">暂无活动</div>'; return; }
  box.innerHTML = list.map(event => {
    let actions = '';
    if (currentUser) {
      if (event.status === '即将开始' && !showingMine) actions += '<button class="btn-primary" onclick="registerEvt(' + event.id + ')">立即报名</button>';
      actions += '<button class="btn-danger" onclick="cancelEvt(' + event.id + ')">取消报名</button>';
      if (String(event.creatorId) === String(currentUser.id)) {
        actions += '<button class="btn-green" onclick="editEvt(' + event.id + ')">修改活动</button>';
        actions += '<button class="btn-danger" onclick="deleteEvt(' + event.id + ')">删除活动</button>';
      }
    }
    return '<div class="event-card"><h3>' + esc(event.title) + '</h3>'
      + '<div class="meta">活动时间：' + esc(event.eventTime) + '</div>'
      + '<div class="meta">地点：' + esc(event.location) + '</div>'
      + '<div class="meta">' + esc(event.description) + '</div>'
      + '<div class="meta">发起人 #' + esc(event.creatorId) + ' · 名额上限：' + esc(event.capacity) + '</div>'
      + '<span class="status-tag ' + (event.status === '即将开始' ? 'status-upcoming' : 'status-ended') + '">' + esc(event.status) + '</span>'
      + '<div class="actions">' + actions + '</div></div>';
  }).join('');
}

function showCreate() {
  if (!currentUser) { msg('请先登录'); return; }
  for (const id of ['cId', 'cTitle', 'cDesc', 'cLoc', 'cTime']) document.getElementById(id).value = '';
  document.getElementById('cCap').value = 50;
  document.getElementById('eventFormTitle').textContent = '发起新活动';
  show('createOverlay');
}

async function editEvt(id) {
  const result = await api('/Q11/event/' + id);
  if (!succeeded(result)) { msg(result.data.message); return; }
  const event = result.data.data;
  document.getElementById('cId').value = event.id;
  document.getElementById('cTitle').value = event.title;
  document.getElementById('cDesc').value = event.description || '';
  document.getElementById('cLoc').value = event.location || '';
  document.getElementById('cTime').value = (event.eventTime || '').replace(' ', 'T');
  document.getElementById('cCap').value = event.capacity;
  document.getElementById('eventFormTitle').textContent = '修改活动';
  show('createOverlay');
}

async function doCreate() {
  const capacity = Number(val('cCap'));
  let eventTime = val('cTime').replace('T', ' ');
  if (eventTime.length === 16) eventTime += ':00';
  const body = {title: val('cTitle'), description: val('cDesc'), location: val('cLoc'), eventTime, capacity};
  if (!body.title || !body.eventTime) { msg('标题和活动时间必填'); return; }
  if (!Number.isInteger(capacity) || capacity < 1) { msg('名额必须为正整数'); return; }
  const id = val('cId');
  const result = await api('/Q11/event' + (id ? '/' + id : ''), id ? 'PUT' : 'POST', body);
  if (!succeeded(result)) { msg(result.data.message); return; }
  hide('createOverlay');
  msg(id ? '活动修改成功' : '活动发起成功');
  await loadEvents();
}

async function deleteEvt(id) {
  if (!confirm('确定删除这场活动吗？')) return;
  const result = await api('/Q11/event/' + id, 'DELETE');
  if (!succeeded(result)) { msg(result.data.message); return; }
  msg('活动已删除');
  await loadEvents(false);
}

async function registerEvt(id) {
  if (!currentUser) { msg('请先登录'); return; }
  const result = await api('/Q11/registration/' + id, 'POST');
  msg(succeeded(result) ? '报名成功' : result.data.message);
  await loadEvents(false);
}

async function cancelEvt(id) {
  if (!currentUser) { msg('请先登录'); return; }
  const result = await api('/Q11/registration/' + id, 'DELETE');
  msg(succeeded(result) ? '已取消报名' : result.data.message);
  if (showingMine) await loadMine();
  else await loadEvents(false);
}

async function loadMine() {
  if (!currentUser) { msg('请先登录'); return; }
  const result = await api('/Q11/registration/mine');
  if (!succeeded(result)) { msg(result.data.message); return; }
  showingMine = true;
  document.getElementById('pagination').style.display = 'none';
  renderList(result.data.data);
}

async function initialize() {
  if (getToken()) {
    const result = await api('/Q10/auth/me');
    if (succeeded(result)) currentUser = result.data.data;
  }
  refreshHeader();
  await loadEvents();
}

initialize();
</script>
</body>
</html>
