<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>线上活动报名系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #333; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }

  /* 顶部 */
  .header { display: flex; justify-content: space-between; align-items: center; background: #fff;
            padding: 14px 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .header h1 { font-size: 20px; color: #4a69bd; }
  #userInfo { font-size: 14px; color: #666; }
  #userInfo button { margin-left: 10px; }

  /* 按钮和输入框通用 */
  button { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .btn-primary { background: #4a69bd; color: #fff; }
  .btn-primary:hover { background: #3b5998; }
  .btn-danger { background: #e74c3c; color: #fff; }
  .btn-green { background: #27ae60; color: #fff; }
  input, textarea { padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; width: 100%; }
  label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }

  /* 表单弹层 */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
             justify-content: center; align-items: center; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; width: 420px; max-width: 92vw; }
  .modal h2 { margin-bottom: 16px; font-size: 18px; }
  .form-row { margin-bottom: 12px; }

  /* 活动卡片 */
  .event-list { margin-top: 20px; display: grid; gap: 14px; }
  .event-card { background: #fff; border-radius: 10px; padding: 18px 20px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .event-card h3 { font-size: 17px; color: #2c3e50; margin-bottom: 8px; }
  .event-card .meta { font-size: 13px; color: #888; margin-bottom: 6px; line-height: 1.7; }
  .event-card .status-tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 10px; }
  .status-upcoming { background: #e8f6ff; color: #2980b9; }
  .status-ended { background: #f0f0f0; color: #999; }
  .event-card .actions { margin-top: 10px; }
  .event-card .actions button { margin-right: 8px; }

  .msg { margin-top: 14px; font-size: 13px; color: #e74c3c; min-height: 18px; }
  .empty { text-align: center; color: #aaa; padding: 40px 0; }
</style>
</head>
<body>
  <div class="container">

    <!-- 顶部 -->
    <div class="header">
      <h1>线上活动报名系统</h1>
      <div id="userInfo">
        <span id="welcome"></span>
        <button class="btn-primary" id="btnLogin" onclick="showLogin()">登录 / 注册</button>
        <button class="btn-green" id="btnMine" onclick="loadMine()" style="display:none">我的报名</button>
        <button class="btn-danger" id="btnLogout" onclick="logout()" style="display:none">退出</button>
      </div>
    </div>

    <!-- 筛选栏 -->
    <div style="margin-top:16px;display:flex;gap:10px;align-items:center;background:#fff;padding:12px;border-radius:10px;">
      <input id="kw" placeholder="搜索标题或描述" style="flex:1">
      <select id="st" style="padding:8px;border:1px solid #ddd;border-radius:6px;">
        <option value="">全部状态</option>
        <option value="即将开始">即将开始</option>
        <option value="已结束">已结束</option>
      </select>
      <button class="btn-primary" onclick="loadEvents()">搜索</button>
      <button class="btn-green" id="btnCreate" onclick="showCreate()" style="display:none">发起活动</button>
    </div>

    <div id="msg" class="msg"></div>

    <!-- 活动列表 -->
    <div class="event-list" id="eventList"></div>

    <!-- 登录 / 注册弹层 -->
    <div class="overlay" id="loginOverlay" onclick="if(event.target===this)hide('loginOverlay')">
      <div class="modal">
        <h2 id="loginTitle">登录</h2>
        <div class="form-row"><label>用户名</label><input id="loginUser"></div>
        <div class="form-row"><label>密码</label><input id="loginPass" type="password"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;">
          <button class="btn-green" onclick="doLogin()">登录</button>
          <button class="btn-primary" onclick="doRegister()">注册并登录</button>
        </div>
      </div>
    </div>

    <!-- 发起活动弹层 -->
    <div class="overlay" id="createOverlay" onclick="if(event.target===this)hide('createOverlay')">
      <div class="modal">
        <h2>发起新活动</h2>
        <div class="form-row"><label>标题</label><input id="cTitle"></div>
        <div class="form-row"><label>详细描述</label><textarea id="cDesc" rows="2"></textarea></div>
        <div class="form-row"><label>举办地点</label><input id="cLoc"></div>
        <div class="form-row"><label>活动时间（格式：2026-12-01 10:00:00）</label><input id="cTime"></div>
        <div class="form-row"><label>名额上限</label><input id="cCap" type="number" value="50"></div>
        <div style="display:flex;justify-content:flex-end;">
          <button class="btn-primary" onclick="doCreate()">发起</button>
        </div>
      </div>
    </div>

  </div>

<script>
// ============ 通用工具 ============
const TOKEN_KEY = 'token';

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }
function msg(s) { document.getElementById('msg').textContent = s || ''; }
function show(id) { document.getElementById(id).classList.add('show'); }
function hide(id) { document.getElementById(id).classList.remove('show'); }
function val(id) { return document.getElementById(id).value.trim(); }
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 统一请求封装：自动带 token、自动存登录返回的 token、自动解析 JSON
async function api(url, method, body) {
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  const t = getToken();
  if (t) headers['token'] = t;
  const resp = await fetch(url, { method: method || 'GET', headers, body: body ? JSON.stringify(body) : undefined });
  const tok = resp.headers.get('token');   // 登录成功时 token 在响应头里
  if (tok) setToken(tok);
  const data = await resp.json().catch(() => null);
  return { status: resp.status, data };
}

// ============ 登录 / 注册（Q10 接口收的是参数，不是 JSON，所以放 URL 上）============
function showLogin() { document.getElementById('loginTitle').textContent = '登录'; show('loginOverlay'); }

async function doLogin() {
  const u = val('loginUser'), p = val('loginPass');
  if (!u || !p) { msg('请输入用户名和密码'); return; }
  const r = await api('/Q10/auth/login?username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p), 'POST');
  if (r.status === 200 && getToken()) {
    hide('loginOverlay'); refreshHeader(); msg('登录成功'); loadEvents();
  } else {
    msg(r.data && r.data.message ? r.data.message : '登录失败');
  }
}

async function doRegister() {
  const u = val('loginUser'), p = val('loginPass');
  if (!u || !p) { msg('请输入用户名和密码'); return; }
  const r = await api('/Q10/auth/register?username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p), 'POST');
  if (r.status === 200) { msg('注册成功，自动登录中…'); doLogin(); }
  else { msg(r.data && r.data.message ? r.data.message : '注册失败'); }
}

function logout() { setToken(null); refreshHeader(); msg('已退出登录'); loadEvents(); }

function refreshHeader() {
  const has = !!getToken();
  document.getElementById('btnLogin').style.display = has ? 'none' : 'inline-block';
  document.getElementById('btnMine').style.display = has ? 'inline-block' : 'none';
  document.getElementById('btnLogout').style.display = has ? 'inline-block' : 'none';
  document.getElementById('btnCreate').style.display = has ? 'inline-block' : 'none';
  document.getElementById('welcome').textContent = has ? '已登录' : '';
}

// ============ 活动列表（GET /Q11/event/list + keyword/status 筛选）============
async function loadEvents() {
  const kw = val('kw'), st = document.getElementById('st').value;
  const url = '/Q11/event/list?page=1&size=100'
    + (kw ? '&keyword=' + encodeURIComponent(kw) : '')
    + (st ? '&status=' + encodeURIComponent(st) : '');
  const r = await api(url);
  if (r.status !== 200) { msg(r.data && r.data.message || '加载失败'); return; }
  renderList(r.data.data.records);
}

function renderList(records) {
  const box = document.getElementById('eventList');
  if (!records || records.length === 0) { box.innerHTML = '<div class="empty">暂无活动</div>'; return; }
  box.innerHTML = records.map(e => `
    <div class="event-card">
      <h3>${esc(e.title)}</h3>
      <div class="meta">活动时间：${esc(e.eventTime)}</div>
      <div class="meta">地点：${esc(e.location || '')}</div>
      <div class="meta">${esc(e.description || '')}</div>
      <div class="meta">发起人 #${esc(e.creatorId)} · 名额上限：${esc(e.capacity)}</div>
      <span class="status-tag ${e.status === '即将开始' ? 'status-upcoming' : 'status-ended'}">${esc(e.status || '')}</span>
      <div class="actions">
        <button class="btn-primary" onclick="registerEvt(${e.id})">立即报名</button>
        <button class="btn-danger" onclick="cancelEvt(${e.id})">取消报名</button>
      </div>
    </div>`).join('');
}

// ============ 发起活动（POST /Q11/event，需要登录）============
function showCreate() {
  if (!getToken()) { msg('请先登录'); return; }
  show('createOverlay');
}

async function doCreate() {
  const body = {
    title: val('cTitle'), description: val('cDesc'), location: val('cLoc'),
    eventTime: val('cTime'), capacity: parseInt(val('cCap')) || 50
  };
  if (!body.title || !body.eventTime) { msg('标题和活动时间必填'); return; }
  const r = await api('/Q11/event', 'POST', body);
  if (r.status === 200) { hide('createOverlay'); msg('活动发起成功！'); loadEvents(); }
  else { msg(r.data && r.data.message || '发起失败'); }
}

// ============ 报名 / 取消报名（POST/DELETE /Q11/registration/{id}，需要登录）============
async function registerEvt(id) {
  if (!getToken()) { msg('请先登录'); return; }
  const r = await api('/Q11/registration/' + id, 'POST');
  msg(r.status === 200 ? '报名成功！' : (r.data && r.data.message || '报名失败'));
  loadEvents();
}

async function cancelEvt(id) {
  if (!getToken()) { msg('请先登录'); return; }
  const r = await api('/Q11/registration/' + id, 'DELETE');
  msg(r.status === 200 ? '已取消报名' : (r.data && r.data.message || '取消失败'));
  loadEvents();
}

// ============ 我的报名（GET /Q11/registration/mine）============
async function loadMine() {
  if (!getToken()) { msg('请先登录'); return; }
  const r = await api('/Q11/registration/mine');
  if (r.status !== 200) { msg(r.data && r.data.message || '加载失败'); return; }
  const list = r.data.data || [];
  const box = document.getElementById('eventList');
  if (!list.length) { box.innerHTML = '<div class="empty">你还没有报名任何活动</div>'; return; }
  box.innerHTML = list.map(e => `
    <div class="event-card">
      <h3>${esc(e.title)}</h3>
      <div class="meta">活动时间：${esc(e.eventTime)}</div>
      <div class="actions">
        <button class="btn-danger" onclick="cancelEvt(${e.id})">取消报名</button>
      </div>
    </div>`).join('');
}

// ============ 页面加载 ============
refreshHeader();
loadEvents();
</script>
</body>
</html>
